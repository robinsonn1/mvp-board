<!DOCTYPE html>
<html>
<head>
    <title>World Cup Live Engine V2</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url("https://images.unsplash.com/photo-1508098682722-e99c43a406b2");
            background-size: cover;
            opacity: 0.12;
            z-index: -1;
        }

        /* TOP BAR */
        .topbar {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(17, 24, 39, 0.95);
            border-bottom: 1px solid #1f2937;
        }

        .live {
            color: red;
            font-weight: bold;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        .score {
            font-size: 22px;
            font-weight: bold;
        }

        .minute {
            color: #9ca3af;
        }

        /* MATCH INFO */
        .matchinfo {
            text-align: center;
            font-size: 13px;
            color: #9ca3af;
        }

        /* LAYOUT */
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 10px;
            padding: 15px;
        }

        .panel {
            background: rgba(17, 24, 39, 0.85);
            border-radius: 12px;
            padding: 10px;
            height: 85vh;
            overflow-y: auto;
        }

        /* PLAYER ROW */
        .player {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .bar {
            height: 6px;
            border-radius: 5px;
            background: linear-gradient(90deg, #22c55e, #16a34a);
        }

        .name {
            width: 220px;
            font-size: 12px;
        }

        .scoreval {
            font-size: 12px;
            width: 40px;
            text-align: right;
        }

        /* TEAM COLORS */
        .Spain { background: rgba(255, 0, 0, 0.12); }
        .France { background: rgba(0, 90, 255, 0.12); }

        /* TOP 3 */
        .top3 {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .card {
            flex: 1;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #374151;
            margin: auto;
        }

        /* FEED */
        .feed-item {
            font-size: 12px;
            padding: 6px;
            border-bottom: 1px solid #1f2937;
        }

        /* SECTION TITLE */
        h3 {
            margin-top: 5px;
            font-size: 14px;
            color: #d1d5db;
        }

        .coach {
            font-size: 11px;
            color: #9ca3af;
        }

    </style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="live">🔴 LIVE</div>

    <div>
        <div class="score" id="score">0 - 0</div>
        <div class="matchinfo" id="teams">Loading...</div>
    </div>

    <div class="minute" id="minute">0'</div>
</div>

<!-- MAIN -->
<div class="container">

    <!-- FEED -->
    <div class="panel">
        <h3>Match Feed</h3>
        <div id="feed"></div>
    </div>

    <!-- CENTER -->
    <div class="panel">

        <h3>Top 3 Players</h3>
        <div id="top3" class="top3"></div>

        <h3>Player Ranking (22)</h3>
        <div id="players"></div>

    </div>

    <!-- RIGHT -->
    <div class="panel">
        <h3>Match Stats</h3>

        <div class="feed-item">⚽ Goals: <span id="goals">0</span></div>
        <div class="feed-item">🎯 Shots: <span id="shots">0</span></div>
        <div class="feed-item">🚩 Fouls: <span id="fouls">0</span></div>

        <br>

        <h3>Engine Info</h3>
        <div class="feed-item">AI Impact Engine v1</div>
        <div class="feed-item">Pass +0.3</div>
        <div class="feed-item">Shot +2</div>
        <div class="feed-item">Goal +10</div>
        <div class="feed-item">Foul -1</div>

        <br>

        <h3>Emoji Guide</h3>
        <div class="feed-item">⭐ Captain</div>
        <div class="feed-item">🧤 Goalkeeper</div>
        <div class="feed-item">🔥 Hot form</div>
        <div class="feed-item">📈 Rising</div>
        <div class="feed-item">📉 Falling</div>
    </div>

</div>

<script>

async function updateStatus() {
    const res = await fetch("/match/1/status");
    const data = await res.json();

    document.getElementById("score").innerText = data.score;
    document.getElementById("minute").innerText = data.minute + "'";

    document.getElementById("teams").innerText =
        `${data.home} vs ${data.away}`;
}

async function updateImpact() {
    const res = await fetch("/match/1/impact");
    const data = await res.json();

    const players = data.players;

    const container = document.getElementById("players");
    const top3 = document.getElementById("top3");

    container.innerHTML = "";
    top3.innerHTML = "";

    const max = Math.max(...players.map(p => p.impact_score)) || 1;

    players.forEach((p, i) => {

        const width = (p.impact_score / max) * 100;

        const div = document.createElement("div");
        div.className = `player ${p.team}`;

        div.innerHTML = `
            <div class="name">
                ${i + 1}. #${p.number} ${p.flag} ${p.name} ${p.icons || ""}
            </div>

            <div style="flex:1; margin:0 10px;">
                <div class="bar" style="width:${width}%"></div>
            </div>

            <div class="scoreval">${p.impact_score.toFixed(1)}</div>
        `;

        container.appendChild(div);

        if (i < 3) {
            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <div class="avatar"></div>
                <div>${p.name}</div>
                <div>${p.position}</div>
                <div>🔥 ${p.impact_score.toFixed(1)}</div>
            `;

            top3.appendChild(card);
        }
    });
}

async function updateFeed() {
    const res = await fetch("/match/1/feed");
    const data = await res.json();

    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    data.forEach(e => {
        const div = document.createElement("div");
        div.className = "feed-item";
        div.innerText = `${e.minute}' - ${e.event.toUpperCase()} - ${e.player} (${e.team})`;
        feed.appendChild(div);
    });
}

async function updateStats() {
    const res = await fetch("/match/1/stats");
    const data = await res.json();

    document.getElementById("goals").innerText = data.goals;
    document.getElementById("shots").innerText = data.shots;
    document.getElementById("fouls").innerText = data.fouls;
}

function loop() {
    updateStatus();
    updateImpact();
    updateFeed();
    updateStats();
}

setInterval(loop, 2000);
loop();

const ws = new WebSocket("ws://127.0.0.1:8000/ws");

ws.onmessage = () => {
    loop();
};

</script>

</body>
</html>
